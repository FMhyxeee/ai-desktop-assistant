[package]
name = "ai-desktop-assistant"
version = "0.1.0"
description = "Desktop assistant app powered by agent-lib"
authors = ["ai-lab"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_desktop_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.1.0", features = [] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-store = "2.0.0"
tauri-plugin-dialog = "2.0.0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
agent-lib = { path = "../../agent-lib" }
async-trait = "0.1"
tokio = { version = "1", features = ["time", "process", "io-util", "sync"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.7-alpha.10"
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
